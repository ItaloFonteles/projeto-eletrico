# Casa térrea de exemplo: 2 quartos (1 suíte), Boa Vista - RR
# Para gerar:  python -m eletrica projetos/casa-exemplo.toml

[projeto]
nome = "Casa Exemplo"
cliente = "Família Silva"
cidade = "Boa Vista - RR"
alimentacao = "bifasico"        # monofasico | bifasico | trifasico
tensao_fn = 127                 # fase-neutro
tensao_ff = 220                 # fase-fase
temperatura_ambiente = 35       # Boa Vista: usar 35 °C (lado da segurança)
circuitos_por_eletroduto = 3    # pior trecho (saída do quadro)
quadro_x = 5.0                  # posição do quadro na planta (m), no corredor
quadro_y = 5.15

# Cada cômodo: tipo, largura e comprimento (m) e posição na planta (x, y do canto
# superior esquerdo, em metros). A distância até o quadro é estimada pela planta;
# para informar na mão, use distancia_quadro = N.
#
# Portas e janelas (aberturas): parede N (cima), S (baixo), L (direita) ou O (esquerda);
# "inicio" é a distância do canto (esquerdo em N/S, de cima em L/O) até o vão.
# Cadastre a porta nos dois cômodos; no cômodo para onde ela NÃO abre, use folha = false.
#
# Opcional: tomadas = N, pontos_luz = N, [[comodos.equipamentos]] e
# [[comodos.pontos]] para fixar um ponto à mão (tipo, indice, x, y relativos ao cômodo).
# Cômodo irregular: em vez de largura/comprimento, use area = N e perimetro = N.

[[comodos]]
nome = "Varanda"
tipo = "varanda"
largura = 4.0
comprimento = 2.0
x = 0.0
y = 0.0
aberturas = [
  { tipo = "porta", parede = "S", inicio = 1.6, largura = 0.9, folha = false },
]

[[comodos]]
nome = "Sala"
tipo = "sala"
largura = 4.5
comprimento = 4.0
x = 0.0
y = 2.0
tomadas = 5
aberturas = [
  { tipo = "porta", parede = "N", inicio = 1.6, largura = 0.9 },
  { tipo = "janela", parede = "O", inicio = 1.2, largura = 1.5 },
  { tipo = "porta", parede = "L", inicio = 3.1, largura = 0.8, folha = false },
  { tipo = "porta", parede = "S", inicio = 2.2, largura = 0.8, folha = false },
]

[[comodos]]
nome = "Cozinha"
tipo = "cozinha"
largura = 3.5
comprimento = 3.0
x = 4.5
y = 2.0
aberturas = [
